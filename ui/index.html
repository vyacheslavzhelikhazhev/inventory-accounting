a{min-height:75px;resize:vertical}.full{grid-column:1/-1}.details{display:grid;grid-template-columns:140px 1fr;gap:12px;font-size:13px;line-height:1.6}.details dt{color:var(--muted)}.details dd{margin:0;overflow-wrap:anywhere}
.shade{position:fixed;inset:0;background:var(--shade);backdrop-filter:blur(3px);z-index:10;display:flex;justify-content:center;align-items:center;padding:28px;overflow-y:auto}.dialog{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:660px;max-width:100%;padding:28px;box-shadow:0 24px 90px #050c2938;position:relative;max-height:calc(100vh - 56px);display:flex;flex-direction:column}.dialog.wide{width:800px}.dialogbody{min-height:0;overflow-y:auto;padding:2px 3px}.dialoghead,.dialog>.foot,.dialog>.error{flex-shrink:0}.dialoghead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:24px}.dialoghead .muted{margin-top:5px;font-size:11px}.dialog>.foot{padding-top:20px;border-top:1px solid var(--line);margin-top:22px;flex-wrap:wrap;gap:8px}.dialog>.foot>.btn{max-width:100%;min-width:0;white-space:normal}.asset-hero{display:flex;gap:18px;margin:0 0 24px;align-items:flex-start}.asset-icon{display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);border-radius:13px;width:68px;height:68px;flex-shrink:0;color:var(--muted)}.asset-icon svg{width:33px;height:33px}.asset-hero h3{font-size:18px;font-weight:550;line-height:1.5;margin:10px 0 8px;overflow-wrap:anywhere}.serial{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.asset-facts{display:grid;grid-template-columns:1fr 1fr;gap:22px 18px;padding:22px;background:var(--soft);border-radius:11px}.asset-facts span{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.asset-facts strong{font-size:13px;font-weight:500;overflow-wrap:anywhere}.asset-details{margin-top:18px}.asset-details>summary,.validation>summary{padding:12px 0;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.asset-details>summary:after,.connection>summary:after{content:'+'}.asset-details[open]>summary:after,.connection[open]>summary:after{content:'−'}.validation{border-bottom:1px solid var(--line) .devices{margin-top:15px}.device{display:flex;gap:14px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.device svg{color:var(--muted)}.device .text{flex:1;min-width:0}.device small{color:var(--muted);display:block;margin-top:5px;overflow-wrap:anywhere}.device.link{cursor:pointer}.device.link:hover{background:var(--soft)}.choices{max-height:220px;overflow:auto;margin:15px 0;border:1px solid var(--line);border-radius:8px}.choice{display:flex;align-items:center;gap:12px;padding:13px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}.choice:last-child{border:0}.choice input{accent-color:var(--accent);width:17px;height:17px;flex-shrink:0}.choice small{color:var(--muted);display:block;margin-top:4px}.cartitem{padding:16px 18px;background:var(--soft);border-radius:10px;margin-top:14px;font-size:13px}.cartitem .fields{margin:16px 0 3px;gap:12px}.cartitem .field input,.cartitem .field select{background:var(--surface);padding:8px;min-height:36px}.error{color:var(--danger);padding:12px 0;font-size:13px;line-height:1.5;white-space:pre-wrap}.error:empty{display:none}.okcircle{width:50px;height:50px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);color:var(--ink);margin-bottom:20px}.toast{position:fixed;bottom:25px;right:28px;background:var(--ink);color:var(--surface);padding:14px 22px;border-radius:9px;box-shadow:0 8px 20px #0002;z-index:30}.menu{display:flex;gap:8px;flex-wrap:wrap;padding-top:17px}.globalerror{background:var(--warning-bg);color:var(--danger);padding:15px;border-radius:8px}.supplylist{max-height:220px;overflow:auto}.searchresults{margin-top:20px}.split{display:flex;gap:20px;justify-content:space-between;align-items:center}.busybar{position:fixed;top:0;left:206px;right:0;height:3px;background:#6e91d0;z-index:50;animation:pulse .8s infinite alternate}@keyframes pulse{to{opacity:.3}}@media(max-width:1000px){.main{padding:30px 24px}.layout{grid-template-columns:180px 1fr}.side{width:180px}.nav{gap:9px}.brand{margin-left:8px}.busybar{left:180px}.table td{padding:14px 9px}.toolbar{flex-wrap:wrap}.shade{padding:20px}.dialog{max-height:calc(100vh - 40px);padding:24px}.metric{padding:18px}.action{padding:18px 15px}.action small{font-size:11px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.syncbar{margin:0 0 24px;padding:12px 16px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--muted)}.syncbar strong{color:var(--ink);font-weight:500}.syncbar .btn{min-height:30px;padding:5px 10px;font-size:12px}
</style></head><body><div id="app"><div class="empty">Загрузка…</div></div><div id="modal"></div><div id="toast"></div>
<script>
const icons={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5"/>',laptop:'<rect x="4" y="3" width="16" height="13" rx="2"/><path d="M2 20h20l-2-4H4Z"/>',box:'<path d="m3 7 9-5 9 5v10l-9 5-9-5ZM3 7l9 5 9-5M12 12v10M7 4l10 6"/>',file:'<path d="M14 2H5v20h14V7ZM14 2v5h5M8 12h8M8 16h8"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',settings:'<path d="M12 2 9 5H5v4l-3 3 3 3v4h4l3 3 3-3h4v-4l3-3-3-3V5h-4Z"/><circle cx="12" cy="12" r="3"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',arrow:'<path d="m9 5 7 7-7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',mouse:'<rect x="6" y="2" width="12" height="20" rx="6"/><path d="M12 2v7M6 9h12"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M3 17v4h18v-4"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.box}</svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,cls='',ic='',attrs='')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${attrs}>${ic?icon(ic):''}${esc(label)}</button>`;
const opts=(rows,value)=>rows.map(r=>{const [id,name]=Array.isArray(r)?r:[r,r];return `<option value="${esc(id)}" ${String(id)===String(value)?'selected':''}>${esc(name)}</option>`}).join('');
const field=(label,key,value='',type='text',full=false)=>`<label class="field ${full?'full':''}">${esc(label)}<input type="${type}" name="${key}" value="${esc(value)}"></label>`;
const select=(label,key,rows,value='',full=false)=>`<label class="field ${full?'full':''}">${esc(label)}<select name="${key}" aria-label="${esc(label)}"><option value="">Выбрать</option>${opts(rows,value)}</select></label>`;
const deviceicon=a=>a.type==='Мышь'?'mouse':a.type==='Мобильный телефон'?'phone':a.type==='Ноутбук'?'laptop':'box';
const dt=v=>v?new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
let data=null,view='home',q='',tab='Действующий',eqstatus='',eqtype='',modal=null,cart=[],person=null,recipient=null,op='',busy=false,legacy=false,importPlan=null;
const $=s=>document.querySelector(s);
async function api(action,p={}){const r=await window.pywebview.api.request(action,p);if(!r.ok)throw Error(r.error);return r.data;}
async function refresh(){data=await api('snapshot');applyTheme(data.preferences?.theme||'light');render();}
function peopleOptions(){return data.employees.filter(e=>e.status==='Действующий').map(e=>[e.id,`${e.name} · ${e.role}`]);}
function own(kind,id){return data.assets.filter(a=>a.target_kind===kind&&String(a.target_id)===String(id));}
function responsibility(e){if(!e)return [];const unique=data.employees.filter(x=>x.name.trim().toLowerCase()===e.name.trim().toLowerCase()).length===1;return data.assets.filter(a=>(String(a.responsible_id)===String(e.id)||(!a.responsible_id&&unique&&String(a.responsible||'').trim().toLowerCase()===e.name.trim().toLowerCase()))&&!(a.target_kind==='Сотрудник'&&String(a.target_id)===String(e.id)));}
function current(){return person?data.employees.find(e=>e.id===person):null;}
function count(e){return own('Сотрудник',e.id).length;}
function matches(v){return String(v??'').toLocaleLowerCase().includes(q.toLocaleLowerCase());}
function toast(t){$('#toast').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>$('#toast').innerHTML='',3500);}
function nav(v,label,ic){return `<button class="nav ${view===v?'active':''}" data-view="${v}">${icon(ic)}${label}</button>`;}
function render(){
 $('#app').innerHTML=`<div class="layout"><aside class="side"><div class="brand">${icon('box')}Матучет</div>${nav('home','Главная','home')}${nav('people','Сотрудники','users')}${nav('equipment','Оборудование','laptop')}${nav('documents','Документы','file')}${nav('history','История','clock')}<div class="spacer"></div>${nav('settings','Настройки','settings')}<button class="theme-toggle" data-action="theme" aria-label="Сменить тему">${icon(theme==='dark'?'sun':'moon')}<span>${theme==='dark'?'Светлая тема':'Темная тема'}</span></button><div class="trial">Матучет 1.5.1</div></aside><main class="main"><div id="syncbanner">${syncBanner()}</div>${data.admin_mode?`<div class="notice">Редактирование без актов включено ${btn('Выключить','admindisable')}</div>`:''}${screen()}</main></div>${busy?'<div class="busybar"></div>':''}`;
}
function search(placeholder='Поиск'){return `<label class="search">${icon('search')}<input data-search value="${esc(q)}" placeholder="${placeholder}" aria-label="${placeholder}"></label>`;}
function screen(){
 if(view==='home')return homeScreen();
 if(view==='people')return `<div class="head"><h1>Сотрудники</h1>${btn('Добавить','newemployee','','plus')}</div><div class="toolbar">${search('Имя или должность')}${btn('Объекты','objects')}</div><div class="tabs">${['Действующий','Уволен','Все'].map(t=>`<button class="tab ${tab===t?'active':''}" data-tab="${t}">${t==='Действующий'?'Действующие':t==='Уволен'?'Уволенные':t}</button>`).join('')}</div><div id="results">${peopleRows()}</div>`;
 if(view==='equipment')return `<div class="head"><h1>Оборудование</h1><div class="row">${data.admin_mode?btn('Добавить без акта','adminnewasset'):''}${btn('Добавить оборудование','supply','','plus')}</div></div><div class="toolbar">${search('Название, серийный номер или получатель')}<select class="filter" data-filter="status"><option value="">Все статусы</option>${opts(['На складе','В эксплуатации','Поломка','В ремонте','Списано'],eqstatus)}</select><select class="filter" data-filter="type"><option value="">Все типы</option>${opts(data.types,eqtype)}</select></div><div id="results">${assetRows()}</div>`;
 if(view==='documents')return `<div class="head"><h1>Документы</h1>${btn('Папка актов','actsfolder','','file')}</div><div class="toolbar">${search('Сотрудник или операция')}</div><div id="results">${documentRows()}</div>`;
 if(view==='history')return `<div class="head"><h1>История</h1></div><div class="tabs"><button class="tab ${!legacy?'active':''}" data-legacy="false">Операции</button><button class="tab ${legacy?'active':''}" data-legacy="true">Старый журнал</button></div><div class="toolbar">${search('Операция, получатель или автор')}</div><div id="results">${historyRows()}</div>`;
 return settingsScreen();
}
function peopleRows(){const es=data.employees.filter(e=>(tab==='Все'||e.status===tab)&&matches(e.name+' '+e.role));return `<table class="table"><thead><tr><th>Сотрудник</th><th>Должность</th><th class="num">Техника</th><th></th></tr></thead><tbody>${es.map(e=>`<tr class="click" data-person="${e.id}"><td>${esc(e.name)}${e.status==='Уволен'?'<small>Уволен</small>':''}</td><td>${esc(e.role)}</td><td class="num">${count(e)}</td><td>${icon('arrow')}</td></tr>`).join('')}</tbody></table>${!es.length?'<div class="empty">Ничего не найдено</div>':''}`;}

function supplyDialog(){return dialog('Поступление на склад',`<form id="supplyform"><div class="fields">${select('Основание','mode',['Новая поставка','Ранее не учтено'],modal.mode||'Новая поставка')}${field('Номер документа','document',modal.document)}</div><h3>Оборудование</h3><div class="fields">${select('Тип','type',data.types,modal.itemtype||'')}${field('Название','name')}${field('Серийный номер','serial')}${field('Комплектность','kit')}${select('Состояние','condition',['Новое','Б/у','Неисправно'],'Новое')}${field('Количество без серийных номеров','quantity',1,'number')}${field('Стоимость одной единицы по документу, ₽','purchase_price')}</div></form><div class="foot">${btn('Добавить позицию','addsupply','','plus')}</div><div class="supplylist">${supplies.map((r,i)=>`<div class="device"><div class="text">${esc(r.name)}<small>${esc(r.serial||'Без серийного номера')} · ${esc(r.kit)}${r.purchase_price?' · '+displayPrice(r.purchase_price)+' ₽':''}</small></div>${btn('','removesupply','icon','close',`data-index="${i}" aria-label="Убрать позицию"`)}</div>`).join('')}</div>`,btn('Отмена','close')+btn(`Принять ${supplies.length?'('+supplies.length+')':''} и создать акт`,'commitsupply','primary'),'','true');}
function formData(id){return Object.fromEntries(new FormData($(id)).entries());}
async function mutate(action,p,success){if(busy)return;busy=true;document.body.insertAdjacentHTML('beforeend','<div class="busybar"></div>');document.querySelectorAll('#modal button,#settingsform button').forEach(b=>b.disabled=true);try{const result=await api(action,{...p,revision:data.revision});await refresh();if(success)success(result);else{modal=null;$('#modal').innerHTML='';toast('Сохранено');}}catch(e){await refresh();const err=$('#formerror');if(err)err.textContent=e.message;else toast(e.message);}finally{busy=false;document.querySelectorAll('.busybar').forEach(b=>b.remove());document.querySelectorAll('#modal button,#settingsform button').forEach(b=>b.disabled=false);}}
document.addEventListener('input',ev=>{if(ev.target.matches('[data-recipientsearch]'))$('#recipientresults').innerHTML=recipientChoices(ev.target.value);if(ev.target.matches('[data-search]')){q=ev.target.value;$('#results').innerHTML=view==='home'?globalResults():view==='people'?peopleRows():view==='equipment'?assetRows():view==='documents'?documentRows():historyRows();}if(ev.target.matches('[data-stocksearch]'))$('#stockchoices').innerHTML=stockChoices(ev.target.value);});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.filter){if(t.dataset.filter==='status')eqstatus=t.value;else eqtype=t.value;$('#results').innerHTML=assetRows();}if(t.dataset.choice){captureCart();const id=Number(t.dataset.choice);if(t.checked){if(!cart.some(r=>r.id===id))cart.push(cartRow(data.assets.find(a=>a.id===id),t.dataset.kind));}else cart=cart.filter(r=>r.id!==id);$('#cart').innerHTML=cartHTML();}});
document.addEventListener('click',async ev=>{const el=ev.target.closest('button,[data-person],[data-asset],[data-history],[data-object]');if(!el||busy)return;try{
 if(el.dataset.view){view=el.dataset.view;q='';render();close();return;}
 if(el.dataset.tab){tab=el.dataset.tab;render();return;}if(el.dataset.legacy){legacy=el.dataset.legacy==='true';q='';render();return;}
 if(el.dataset.person){person=Number(el.dataset.person);const e=current();recipient={kind:'Сотрудник',id:e.id,name:e.name};show('person');return;}
 if(el.dataset.object){person=null;const o=data.objects.find(o=>o[0]===el.dataset.object);recipient={kind:'Объект',id:o[0],name:o[1]};show('person');return;}
 if(el.dataset.asset){show('asset',{id:Number(el.dataset.asset)});return;}if(el.dataset.history){show('history',{id:Number(el.dataset.history)});return;}
 const a=el.dataset.action;
 if(a==='adminprompt')show('adminenable');
 if(a==='adminenable')await task('admin_mode',{enabled:true},()=>{modal=null;$('#modal').innerHTML='';toast('Редактирование включено');});
 if(a==='admindisable')await task('admin_mode',{enabled:false},()=>{modal=null;$('#modal').innerHTML='';toast('Редактирование выключено');});
 if(a==='adminnewasset')show('adminasset');
 if(a==='adminsaveasset'){const p=formData('#adminassetform');const [kind,...rest]=(p.recipient||'').split(':');const target=rest.join(':');await mutate('admin_asset',{...p,id:modal.id,target_kind:kind||'',target_id:kind==='Сотрудник'?Number(target):target,responsible_id:Number(p.responsible_id)||null});}
 if(a==='adminsaveemployee')await mutate('admin_employee',{...formData('#adminemployeeform'),id:modal.id});
 if(a==='admindict'){const key=modal.key;const row=key==='objects'?data.objects.find(o=>o[1]===el.dataset.value):null;show('admindict',{key,id:row?.[0],old:el.dataset.value,kind:row?.[2]});}
 if(a==='adminsavedict')await mutate('admin_dictionary',{...formData('#admindictform'),key:modal.key,id:modal.id,old:modal.old});

 if(a==='theme'){const next=theme==='dark'?'light':'dark';await api('preferences',{theme:next});applyTheme(next);data.preferences={theme:next};render();return;}
 if(a==='stock'||a==='returnlist'){view='equipment';q='';eqtype='';eqstatus=a==='stock'?'На складе':'В эксплуатации';render();return;}
 if(a==='assetissue'){show('pickrecipient',{id:modal.id});return;}
 if(a==='assetreturn'||a==='assetreplace'){beginAssetOperation(modal.id,a==='assetreturn'?'Возврат':'Замена');return;}
 if(a==='pickrecipient'){const id=modal.id;person=el.dataset.kind==='Сотрудник'?Number(el.dataset.id):null;recipient={kind:el.dataset.kind,id:person||el.dataset.id,name:el.dataset.name};op='Выдача';cart=[cartRow(data.assets.find(x=>x.id===id),'Выдача')];show('operation',{singleIssue:id});return;}
 if(a==='close')close();
 if(a==='newemployee')show('employee');
 if(a==='objects')show('objects');
 if(a==='more')$('#moremenu').innerHTML=`<div class="menu">${btn('Изменить ФИО / должность','editemployee')}${current()?.status==='Действующий'?btn('Увольнение','dismiss','danger'):''}</div>`;
 if(a==='editemployee')show(data.admin_mode?'adminemployee':'employee',{id:person});
 if(a==='saveemployee')await mutate('employee',{...formData('#employeeform'),id:modal.id});
 if(a==='issue'||a==='return'||a==='replace'||a==='dismiss')startOp(({issue:'Выдача',return:'Возврат',replace:'Замена',dismiss:'Увольнение'})[a]);
 if(a==='removeitem'){captureCart();const id=cart[Number(el.dataset.index)].id;cart.splice(Number(el.dataset.index),1);document.querySelectorAll(`[data-choice="${id}"]`).forEach(c=>c.checked=false);$('#cart').innerHTML=cartHTML();}
 if(a==='commitoperation'){captureCart();await mutate('operation',{operation:op,target_kind:recipient.kind,target_id:recipient.id,responsible_id:Number(modal.responsible_id)||null,location:modal.location,basis:modal.basis,note:modal.note,items:cart},r=>show('success',r));}
 if(a==='supply'){supplies=[];show('supply');}
 if(a==='addsupply'){const p=formData('#supplyform');const n=Number(p.quantity);if(!p.type||!p.name.trim()||!p.kit.trim()||!p.condition)throw Error('Заполните тип, название, комплектность и состояние.');if(!Number.isInteger(n)||n<1||n>100||supplies.length+n>100)throw Error('Количество должно быть от 1 до 100.');if(p.serial.trim()&&n!==1)throw Error('У каждого устройства с серийным номером должна быть отдельная строка.');modal.document=p.document;modal.mode=p.mode;modal.itemtype=p.type;for(let i=0;i<n;i++)supplies.push({type:p.type,name:p.name.trim(),serial:p.serial.trim(),kit:p.kit.trim(),condition:p.condition,purchase_price:parsePrice(p.purchase_price)});renderModal();}
 if(a==='removesupply'){const p=formData('#supplyform');modal.document=p.document;modal.mode=p.mode;supplies.splice(Number(el.dataset.index),1);renderModal();}
 if(a==='commitsupply'){const p=formData('#supplyform');if(['name','serial','kit','purchase_price'].some(k=>String(p[k]||'').trim()))throw Error('Сначала добавьте заполненную позицию в список кнопкой «Добавить позицию».');await mutate('receive',{mode:p.mode,document:p.document,items:supplies},r=>show('success',r));}
 if(a==='editasset')show(data.admin_mode?'adminasset':'editasset',{id:modal.id});
 if(a==='statusasset')show('statusasset',{id:modal.id,status:el.dataset.status});
 if(a==='responsible')show('responsible',{id:modal.id});
 if(a==='saveresponsible'){const p=formData('#responsibleform');await mutate('responsible',{...p,id:modal.id,responsible_id:Number(p.responsible_id)||null});}
 if(a==='saveasset'){const p=formData('#assetform');await mutate('correct_asset',{...p,id:modal.id,target_kind:'Сотрудник',target_id:Number(p.target_id)||null,responsible_id:Number(p.responsible_id)||null});}
 if(a==='savestatus')await mutate('asset_status',{...formData('#statusform'),id:modal.id});
 if(a==='resultact')await api('open',{file:modal.file});
 if(a==='openact')await api('open',{file:data.acts.find(r=>r.id===Number(el.dataset.id)).file});
 if(a==='sign')show('sign',{id:Number(el.dataset.id)});
 if(a==='dosign')await mutate('signed',{id:modal.id});
 if(a==='savesettings')await mutate('settings',formData('#settingsform'),()=>toast('Реквизиты сохранены'));
 if(a==='datafolder')await api('open',{file:'.'});
 if(a==='actsfolder')await api('open',{file:'Акты'});
 if(a==='export'){const r=await api('export');show('exportready',r);}
 if(a==='backup')await task('backup',{},r=>show('backupready',r));
 if(a==='backupfolder')await api('open',{file:'Резервные копии'});
 if(a==='transfer'||a==='move')show('movement',{id:modal.id,operation:a==='transfer'?'Передача':'Перемещение'});
 if(a==='repair'){const x=data.assets.find(x=>x.id===modal.id);show('repair',{id:x.id,phase:x.status==='В ремонте'?'finish':'start'});}
 if(a==='savemovement'){const p=formData('#movementform');const ids=[...document.querySelectorAll('[name=movement_id]:checked')].map(x=>Number(x.value));const [kind,...rest]=(p.recipient||'').split(':');const id=rest.join(':');await mutate('movement',{...p,ids,operation:modal.operation,target_kind:kind,target_id:kind==='Сотрудник'?Number(id):id,responsible_id:Number(p.responsible_id)||null},r=>show('success',r));}
 if(a==='saverepair')await mutate('repair',{...formData('#repairform'),id:modal.id,phase:modal.phase},r=>show('success',r));
 if(a==='restorepreview')await task('restore_preview',{},r=>{if(r)show('restore',r)});
 if(a==='dorestore'){if(!$('#confirmrestore').checked)throw Error('Подтвердите замену локальных данных.');await mutate('restore',{},()=>{modal=null;$('#modal').innerHTML='';toast('Данные восстановлены. Прежние данные сохранены в полной копии.');});}
 if(a==='syncpreview')await task('sync_preview',{},r=>show('syncconnect',r));
 if(a==='syncenable'){if(!$('#confirmsync').checked)throw Error('Подтвердите подключение.');await task('sync_enable',{token:modal.token,confirmed:true},r=>{modal=null;$('#modal').innerHTML='';toast(r.message);});}
 if(a==='synctick')await task('sync_tick',{},r=>toast(r.message));
 if(a==='syncdisable'){if(!confirm('Отключить общий учет на этом ПК? Местные изменения после отключения не будут передаваться коллегам.'))return;await task('sync_disable',{},r=>toast(r.message));}
 if(a==='bitrixsave')await task('bitrix_save',formData('#bitrixform'),()=>toast('Настройки Битрикс24 сохранены'));
 if(a==='bitrixtest')await task('bitrix_test',{},r=>toast(r.message));
 if(a==='bitrixupload')await task('bitrix_upload',{},r=>toast(r.message));
 if(a==='bitrixdownload'){const p=formData('#bitrixdownloadform');await task('bitrix_download',p,r=>show('restore',r));}
 if(a==='dict')show('dict',{key:el.dataset.key});
 if(a==='savedict')await mutate('dictionary',{key:modal.key,...formData('#dictform')});
 if(a==='quality')show('quality');
 if(a==='import'){importPlan=await api('import_preview');if(importPlan)show('import');}
 if(a==='doimport')await mutate('import_commit',formData('#importform'));
 }catch(e){if($('#formerror'))$('#formerror').textContent=e.message;else toast(e.message);}});

function syncBanner(){const b=data?.sync;if(!b?.enabled)return '';return `<div class="${b.state==='blocked'?'notice':'syncbar'}" style="margin-top:0" role="status"><div class="split"><span><strong>Битрикс24</strong> · ${esc(b.message)}${b.state==='blocked'?'<br><small>Новые операции приостановлены. Просмотр и резервные копии доступны.</small>':''}</span>${btn('Обновить','synctick')}</div></div>`;}
function syncDialog(){const join=modal.mode==='join';return dialog(join?'Получить общую базу?':'Опубликовать текущую базу?',`<p>${join?'Местная база будет заменена общей базой из Битрикса. Перед заменой сохраним полную резервную копию.':'В выбранной папке будет создана общая база из данных этого компьютера.'}</p><p class="muted">Версия: ${esc(modal.revision)} · Актов: ${esc(modal.documents)}</p><p class="muted">Работа по очереди. Перед передачей работы коллеге дождитесь статуса «Сохранено в Битрикс24». При отсутствии связи новые операции приостановлены.</p><label class="choice"><input id="confirmsync" type="checkbox">${join?'Подтверждаю замену местной базы':'Это актуальная база для совместной работы'}</label>`,btn('Отмена','close')+btn(join?'Получить и подключить':'Опубликовать и подключить','syncenable','primary'));}
function adminSection(){return `<section class="section"><h3>Редактирование без актов</h3><p class="muted">Оборудование, сотрудники, типы, расположения и объекты. Исправления сохраняются в истории; перед сохранением создается полная копия.</p>${btn(data.admin_mode?'Выключить режим':'Включить режим',data.admin_mode?'admindisable':'adminprompt',data.admin_mode?'':'primary')}</section>`;}
function adminPeople(){return data.employees.map(e=>[e.id,e.name+' · '+e.role+(e.status==='Уволен'?' (уволен)':'')]);}
function adminRecipients(){return [['','Без получателя'],...adminPeople().map(([id,name])=>['Сотрудник:'+id,name]),...data.objects.map(o=>['Объект:'+o[0],'Объект: '+o[1]])];}
function adminAssetDialog(){const a=modal.id?data.assets.find(x=>x.id===modal.id):{status:'На складе',location:'Склад'};const job=(data.repairs||[]).find(j=>j.asset_id===a.id&&j.state==='Открыт');return dialog(modal.id?'Редактировать оборудование без акта':'Добавить оборудование без акта',`<form id="adminassetform"><div class="fields">${select('Тип','type',data.types,a.type)}${field('Название','name',a.name)}${field('Серийный номер','serial',a.serial)}${select('Статус','status',['На складе','В эксплуатации','Поломка','В ремонте','Списано'],a.status)}<label class="field full">Получатель<select name="recipient">${opts(adminRecipients(),a.target_id?a.target_kind+':'+a.target_id:'')}</select></label><label class="field full">Ответственный<select name="responsible_id">${opts([['','Не назначен'],...adminPeople()],a.responsible_id||'')}</select></label>${field('Расположение','location',a.location)}${field('Комплектность','kit',a.kit)}${field('Состояние','condition',a.condition)}${field('Назначение','purpose',a.purpose)}${field('Дата покупки','purchase_date',a.purchase_date,'date')}${field('Документ поставки','supply_doc',a.supply_doc)}${field('Стоимость по документу покупки, ₽','purchase_price',a.purchase_price)}${field('Примечание','notes',a.notes,'text',true)}${field('Сервис / исполнитель (для статуса «В ремонте»)','repair_provider',job?.provider||'','text',true)}${field('Причина редактирования','reason','','text',true)}</div><p class="muted">Акт не создается. ID записи сохраняется автоматически. Для складской или списанной техники выберите «Без получателя».</p></form>`,btn('Отмена','close')+btn('Сохранить без акта','adminsaveasset','primary'),'',true);}
function adminEmployeeDialog(){const e=data.employees.find(x=>x.id===modal.id);return dialog('Редактировать сотрудника без акта',`<form id="adminemployeeform"><div class="fields">${field('ФИО','name',e.name,'text',true)}${field('Должность','role',e.role,'text',true)}${select('Статус','status',['Действующий','Уволен'],e.status,true)}${field('Причина редактирования','reason','','text',true)}</div><p class="muted">При смене статуса техника автоматически не возвращается. Закрепления проверяются в разделе «Проверка учета».</p></form>`,btn('Отмена','close')+btn('Сохранить без акта','adminsaveemployee','primary'));}
function adminDictDialog(){return dialog('Редактировать справочник',`<form id="admindictform"><div class="fields">${field('Название','value',modal.old,'text',true)}${modal.key==='objects'?field('Категория объекта','kind',modal.kind,'text',true):''}${field('Причина редактирования','reason','','text',true)}</div><p class="muted">Название обновится в связанных карточках. История и ранее созданные акты сохраняют прежние сведения.</p></form>`,btn('Отмена','close')+btn('Сохранить без акта','adminsavedict','primary'));}


function bitrixSection(){const b=data.bitrix||{},shared=data.sync||{};return `<div class="connection-body"><h3>Общий учет</h3><p class="muted">${shared.enabled?esc(shared.message):'Получение базы при запуске и отправка изменений. Акты и отчеты доступны на Диске.'}</p><div class="row">${shared.enabled?btn('Обновить сейчас','synctick')+btn('Отключить на этом ПК','syncdisable'):btn('Подключить общий учет','syncpreview','primary')}</div>${shared.enabled?'<p class="muted">Работаем по очереди. Сначала дождитесь сохранения в Битрикс24, затем передавайте работу коллеге.</p>':''}</div><details><summary class="muted" style="padding-top:20px">Настройки подключения и резервные копии</summary><div class="connection-body"><p class="muted">Подключение к выделенной папке на Диске. Ссылка вебхука хранится только на этом компьютере.</p><form id="bitrixform"><div class="fields">${field('Входящий вебхук (оставьте пустым, чтобы сохранить текущий)','webhook','','password',true)}${field('ID папки Диска','folder_id',b.folder_id||'','number')}<label class="field">Автоматическая загрузка<select name="auto">${opts([['false','Выключена'],['true','Через 15 секунд после изменений']],String(!!b.auto))}</select></label></div></form><div class="row">${btn('Сохранить подключение','bitrixsave')}${btn('Проверить','bitrixtest')}${btn('Загрузить полную копию','bitrixupload')}</div><p id="bitrixstatus" class="muted">${esc(b.message||'Не настроено')}</p><form id="bitrixdownloadform"><div class="fields">${field('ID архивного ZIP-файла на Диске','file_id',b.last_file_id||'','number')}</div></form>${btn('Скачать и проверить архив','bitrixdownload')}</div></details>`;}

function recipientOptions(){return [...peopleOptions().map(([id,name])=>['Сотрудник:'+id,name]),...data.objects.map(o=>['Объект:'+o[0],'Объект: '+o[1]])];}
function movementDialog(){const a=data.assets.find(x=>x.id===modal.id),transfer=modal.operation==='Передача';const available=transfer?data.assets.filter(x=>x.target_kind===a.target_kind&&String(x.target_id)===String(a.target_id)&&['В эксплуатации','Поломка'].includes(x.status)):[a];return dialog(modal.operation,`<form id="movementform"><div class="choices">${available.map(x=>`<label class="choice"><input name="movement_id" type="checkbox" value="${x.id}" ${x.id===a.id?'checked':''}><div>${esc(x.name)}<small>${esc(x.serial||'ID '+x.id)}</small></div></label>`).join('')}</div><div class="fields">${transfer?select('Новый получатель','recipient',recipientOptions(),'','true'):''}${select('Расположение','location',data.locations,transfer?a.location:'')}${transfer?select('Ответственный','responsible_id',peopleOptions(),a.responsible_id):''}${field('Основание','reason','','text',true)}</div></form><p class="muted">${transfer?'Передача изменит получателя и ответственного.':'Перемещение сохранит получателя, ответственного и статус.'} Будет создан акт.</p>`,btn('Отмена','close')+btn('Провести и создать акт','savemovement','primary'),a.name,true);}
function repairDialog(){const a=data.assets.find(x=>x.id===modal.id),finish=modal.phase==='finish';const job=(data.repairs||[]).find(x=>x.asset_id===a.id&&x.state==='Открыт');return dialog(finish?'Завершение ремонта':'Передача в ремонт',`<form id="repairform"><p class="muted">Закрепление за получателем и ответственным сохраняется.${job?' Сервис: '+esc(job.provider):''}</p><div class="fields">${finish?select('Результат','result',['Исправно','Неисправно'],'Исправно')+select('Расположение после ремонта','location',data.locations,job?.before?.location||'')+field('Состояние после ремонта','condition',a.condition,'text',true):field('Сервис / исполнитель','provider','','text',true)}${field(finish?'Выполненные работы / результат':'Причина неисправности','reason','','text',true)}</div></form>`,btn('Отмена','close')+btn('Провести и создать акт','saverepair','primary'),a.name);}
function restoreDialog(){return dialog('Восстановить локальный учет?',`<p>Архив от ${esc(dt(modal.created))}. Версия данных: ${esc(modal.revision)}. Актов: ${esc(modal.documents)}.</p><div class="notice">Локальная база, акты и внешний шаблон будут заменены данными архива. Перед заменой сохраняется полная копия текущих данных. Изменения не объединяются.</div><label class="choice"><input id="confirmrestore" type="checkbox">Я подтверждаю замену локальных данных</label>`,btn('Отмена','close')+btn('Восстановить','dorestore','primary'));}
async function task(action,p,done){if(busy)return;busy=true;document.body.insertAdjacentHTML('beforeend','<div class="busybar"></div>');try{const r=await api(action,p);await refresh();if(done)done(r);}catch(e){if($('#formerror'))$('#formerror').textContent=e.message;else toast(e.message);}finally{busy=false;document.querySelectorAll('.busybar').forEach(b=>b.remove());}}
document.addEventListener('change',ev=>{if(ev.target.name==='recipient'&&ev.target.value.startsWith('Сотрудник:')){const el=$('#movementform [name=responsible_id]');if(el)el.value=ev.target.value.split(':')[1];}});
setInterval(async()=>{if(!data||busy||view!=='settings')return;try{const b=await api('bitrix_status');data.bitrix=b;if($('#bitrixstatus'))$('#bitrixstatus').textContent=b.message;}catch(e){}},5000);

document.addEventListener('submit',ev=>ev.preventDefault());
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close();if(ev.key==='Tab'&&modal){const fs=[...document.querySelectorAll('#modal button:not(:disabled),#modal input,#modal select,#modal textarea,#modal summary')].filter(x=>x.getClientRects().length);const first=fs[0],last=fs.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}});
function parsePrice(value){const t=String(value??'').trim().replace(/[ \u00a0]/g,'').replace(',','.');if(!t)return '';if(!/^\d+(?:\.\d{1,2})?$/.test(t)||Number(t)>999999999.99)throw Error('Укажите стоимость с точностью до копеек или оставьте поле пустым.');return Number(t).toFixed(2);}
function displayPrice(value){return value===undefined||value===null||value===''?'':Number(value).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});}
let theme='light';
icons.moon='<path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5Z"/>';
icons.sun='<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>';
function applyTheme(value){theme=value==='dark'?'dark':'light';document.documentElement.dataset.theme=theme;}
function homeScreen(){const stock=data.assets.filter(a=>a.status==='На складе').length,used=data.assets.filter(a=>a.status==='В эксплуатации').length;return `<div class="head"><div><div class="eyebrow">ОБЗОР</div><h1>Учет оборудования</h1></div><div class="row">${data.admin_mode?btn('Добавить без акта','adminnewasset'):''}${btn('Добавить оборудование','supply','primary','plus')}</div></div><div class="metrics"><button class="metric" data-view="equipment"><span>Всего оборудования ${icon('laptop')}</span><strong>${data.assets.length}</strong></button><button class="metric" data-action="stock"><span>На складе ${icon('box')}</span><strong>${stock}</strong></button><button class="metric" data-action="returnlist"><span>В эксплуатации ${icon('users')}</span><strong>${used}</strong></button></div><div class="toolbar">${search('Найти сотрудника или оборудование')}</div><div id="results">${q?globalResults():''}</div><div class="actions"><button class="action" data-action="stock"><span class="action-icon">${icon('arrow')}</span><span>Выдать оборудование<small>Со склада сотруднику или в кабинет</small></span></button><button class="action" data-action="returnlist"><span class="action-icon reverse">${icon('arrow')}</span><span>Принять на склад<small>Вернуть выданное оборудование</small></span></button></div><section class="recent"><div class="split"><h3>Последние операции</h3><button class="text-button" data-view="history">Вся история ${icon('arrow')}</button></div>${data.history.slice(0,4).map(h=>`<button class="recent-row" data-history="${h.id}"><span class="recent-icon">${icon('clock')}</span><span class="text">${esc(h.operation)}<small>${esc(h.target||h.actor||'Учет оборудования')}</small></span><span class="muted">${dt(h.stamp)}</span></button>`).join('')||'<div class="empty">Здесь появятся выдачи, возвраты и поступления</div>'}</section>`;}
function assetDialog(){
 const a=data.assets.find(x=>x.id===modal.id),warnings=assetWarnings(a),assigned=!!a.target_id&&['Сотрудник','Объект'].includes(a.target_kind),stock=a.status==='На складе'&&!a.target_id&&!a.owner,canReturn=assigned&&['В эксплуатации','Поломка'].includes(a.status);
 const details=[['Стоимость по документу, ₽',displayPrice(a.purchase_price)],['Комплектность',a.kit],['Состояние',a.condition],['Назначение',a.purpose],['Примечание',a.notes],['Дата покупки',a.purchase_date],['Документ',a.supply_doc]];
 const more=btn(data.admin_mode?'Редактировать без акта':'Редактировать данные','editasset')+(a.status!=='Списано'?btn('Назначить ответственного','responsible'):'')+(canReturn?btn('Передать другому получателю','transfer')+btn('Заменить оборудование','assetreplace'):'')+(!['Списано','В ремонте'].includes(a.status)?btn('Изменить расположение','move')+btn('Отправить в ремонт','repair'):'')+(!['Списано','В ремонте','Поломка'].includes(a.status)?btn('Отметить неисправность','statusasset','','','data-status="Поломка"'):'')+(a.status==='Поломка'&&!a.target_id&&!a.owner?btn('Вернуть в доступный запас','statusasset','','','data-status="На складе"'):'')+(!a.target_id&&!a.owner&&!['Списано','В ремонте'].includes(a.status)?btn('Списать оборудование','statusasset','danger','','data-status="Списано"'):'');
 const primary=stock?btn('Выдать','assetissue','primary','arrow'):canReturn?btn('Принять на склад','assetreturn','primary','download'):a.status==='В ремонте'?btn('Завершить ремонт','repair','primary'):btn('Закрыть','close');
 return dialog(a.type||'Оборудование',`<div class="asset-hero"><div class="asset-icon">${icon(deviceicon(a))}</div><div><span class="badge">${esc(a.status)}</span><h3>${esc(a.name)}</h3><div class="serial">S/N ${esc(a.serial||'не указан')}</div></div></div><div class="asset-facts"><div><span>Получатель</span><strong>${esc(a.owner||'Не закреплено')}</strong></div><div><span>Расположение</span><strong>${esc(a.location||'Не указано')}</strong></div><div class="full"><span>Ответственный</span><strong>${esc(a.responsible||'Не назначен')}</strong></div></div>${warnings.length?`<details class="validation"><summary>Требует проверки · ${warnings.length}</summary>${warnings.map(w=>`<p>${esc(w)}</p>`).join('')}</details>`:''}<details class="asset-details"><summary>Подробности</summary><dl class="details">${details.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v||'—')}</dd>`).join('')}</dl></details>`,`<details class="more-actions left"><summary class="btn">${icon('more')} Ещё</summary><div class="action-menu">${more}</div></details>${primary}`,`Карточка № ${String(a.id).padStart(4,'0')}`);
}
function beginAssetOperation(id,operation){const a=data.assets.find(x=>x.id===id);if(!a.target_id||!['Сотрудник','Объект'].includes(a.target_kind))throw Error('Сначала уточните получателя в данных оборудования.');person=a.target_kind==='Сотрудник'?Number(a.target_id):null;recipient={kind:a.target_kind,id:a.target_id,name:a.owner};op=operation;cart=[cartRow(a,'Возврат')];show('operation',{single:id});}
function recipientChoices(term=''){const t=term.toLocaleLowerCase();return [...data.employees.filter(e=>e.status==='Действующий').map(e=>({kind:'Сотрудник',id:e.id,name:e.name,detail:e.role})),...data.objects.map(o=>({kind:'Объект',id:o[0],name:o[1],detail:'Общее оборудование'}))].filter(r=>(r.name+' '+r.detail).toLocaleLowerCase().includes(t)).map(r=>`<button class="recipient-option" data-action="pickrecipient" data-kind="${r.kind}" data-id="${esc(r.id)}" data-name="${esc(r.name)}">${icon(r.kind==='Сотрудник'?'users':'box')}<span>${esc(r.name)}<small>${esc(r.detail)}</small></span>${icon('arrow')}</button>`).join('')||'<div class="empty">Ничего не найдено</div>';}
function recipientDialog(){const a=data.assets.find(x=>x.id===modal.id);return dialog('Кому выдать?',`<label class="search">${icon('search')}<input data-recipientsearch placeholder="Сотрудник или кабинет" aria-label="Поиск получателя"></label><div id="recipientresults" class="recipient-list">${recipientChoices()}</div>`,btn('Отмена','close'),a.name);}

setInterval(async()=>{if(!data?.sync?.enabled||busy||modal||view==='settings'||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;busy=true;try{const r=await api('sync_tick');if(r.changed){await refresh();toast('Получена актуальная база из Битрикса');}else{data.sync=r;if($('#syncbanner'))$('#syncbanner').innerHTML=syncBanner();}}catch(e){toast(e.message);}finally{busy=false;document.querySelectorAll('.busybar').forEach(b=>b.remove());}},30000);
window.addEventListener('pywebviewready',()=>refresh().catch(e=>$('#app').innerHTML=`<div class="globalerror">${esc(e.message)}</div>`));
if(window.pywebview)refresh();
</script></body></html>
